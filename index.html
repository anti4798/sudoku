<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스도쿠</title>
    <meta name="description" content="브라우저에서 바로 즐기는 클래식 스도쿠 퍼즐">

    <!-- Open Graph / 링크 미리보기 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sudoku.elfsaycongrew.win/">
    <meta property="og:title" content="스도쿠">
    <meta property="og:description" content="브라우저에서 바로 즐기는 클래식 스도쿠 퍼즐">
    <meta property="og:image" content="https://sudoku.elfsaycongrew.win/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA / 홈 화면에 설치 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="스도쿠">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            touch-action: manipulation;
        }

        /* 스도쿠 보드 */
        #sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid #1e293b;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* 시작 전: 보드를 흐리게 가려서 미리 풀지 못하게 함 */
        #sudoku-board {
            transition: filter 0.4s ease;
        }
        #board-wrap.not-started #sudoku-board {
            filter: blur(10px);
            pointer-events: none;
        }
        #start-overlay {
            transition: opacity 0.4s ease;
        }
        #board-wrap:not(.not-started) #start-overlay {
            opacity: 0;
            pointer-events: none;
        }

        /* 개별 셀 기본 스타일 */
        .cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        @media (max-width: 400px) {
            .cell { font-size: 1.25rem; }
        }

        /* 3x3 구역 굵은 선 */
        .cell.right-thick { border-right: 3px solid #1e293b; }
        .cell.bottom-thick { border-bottom: 3px solid #1e293b; }

        /* 셀 내용 상태 */
        .cell.given {
            font-weight: 800;
            color: #0f172a; /* 검정 */
        }
        .cell.user-input {
            font-weight: 600;
            color: #2563eb; /* 파랑 */
        }

        /* 하이라이트 상태 */
        .cell.related {
            background-color: #f1f5f9; /* 선택된 셀과 같은 행,열,박스 */
        }
        .cell.same-number {
            background-color: #e2e8f0; /* 선택된 셀과 같은 숫자를 가진 셀 */
        }
        .cell.selected {
            background-color: #bfdbfe !important; /* 선택된 셀 */
        }
        .cell.error {
            background-color: #fecaca !important;
            color: #dc2626 !important;
            transition: all 0.3s ease;
        }

        /* 메모 모드 (Pencil Marks) 그리드 스타일 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 2px;
        }
        .note-num {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #64748b; /* 회색 */
            line-height: 1;
        }
        @media (max-width: 400px) {
            .note-num { font-size: 0.5rem; }
        }

        /* 난이도 선택 버튼 */
        .difficulty-btn.active {
            background-color: #1e293b;
            color: #ffffff;
            border-color: #1e293b;
        }

        /* 버튼 및 기타 UI */
        .btn-active:active { transform: scale(0.95); }
        .mode-btn-active {
            background-color: #10b981 !important; /* 메모 모드 ON 시 색상 (초록) */
            color: white !important;
            border-color: #059669 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-2 sm:px-4">

    <!-- 헤더 -->
    <header class="text-center mb-4">
        <h1 class="text-3xl font-bold tracking-tight text-slate-800">스도쿠</h1>
        <div id="timer" class="mt-1 text-lg font-semibold text-slate-500 tabular-nums">00:00</div>
    </header>

    <div class="w-full max-w-md">

        <!-- 난이도 선택 -->
        <div class="grid grid-cols-3 gap-2" id="difficulty">
            <button data-level="easy" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">쉬움</button>
            <button data-level="normal" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">보통</button>
            <button data-level="hard" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">어려움</button>
        </div>

        <!-- 스도쿠 보드 (시작 전에는 흐리게 가려짐) -->
        <div id="board-wrap" class="relative mb-5 mt-2 not-started">
            <div id="sudoku-board" class="rounded-sm">
                <!-- JavaScript를 통해 셀이 생성됩니다 -->
            </div>
            <div id="start-overlay" class="absolute inset-0 flex items-center justify-center">
                <button id="btn-start" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-xl py-4 px-10 rounded-xl shadow-lg transition btn-active">
                    &#9654; 시작
                </button>
            </div>
        </div>

        <!-- 하단 컨트롤 패널 -->
        <div class="space-y-4">
            <!-- 숫자 입력 패드 -->
            <div class="grid grid-cols-9 gap-1 sm:gap-2" id="numpad">
                <!-- 1~9 버튼 JS로 추가 -->
            </div>

            <!-- 액션 버튼 -->
            <div class="flex gap-2 sm:gap-4">
                <button id="btn-check" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">
                    정답 맞추기
                </button>
                <button id="btn-new" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-3 px-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">
                    새 게임
                </button>
            </div>
            
            <!-- 상태 메시지 -->
            <div id="message-area" class="text-center font-bold text-lg text-emerald-600 h-8 opacity-0 transition-opacity flex items-center justify-center">
                축하합니다! 스도쿠를 완성했습니다!
            </div>
        </div>
    </div>

    <script>
        // --- 스도쿠 생성 알고리즘 (백트래킹) ---
        class SudokuGenerator {
            constructor(K = 45) {
                this.N = 9;
                this.SRN = 3;
                this.K = K;
                this.mat = Array.from({ length: this.N }, () => Array(this.N).fill(0));
            }
            fillValues() {
                this.fillDiagonal();
                this.fillRemaining(0, this.SRN);
                let solution = this.mat.map(row => [...row]);
                this.removeKDigits();
                return { puzzle: this.mat, solution: solution };
            }
            fillDiagonal() {
                for (let i = 0; i < this.N; i = i + this.SRN) this.fillBox(i, i);
            }
            unUsedInBox(rowStart, colStart, num) {
                for (let i = 0; i < this.SRN; i++)
                    for (let j = 0; j < this.SRN; j++)
                        if (this.mat[rowStart + i][colStart + j] === num) return false;
                return true;
            }
            fillBox(rowStart, colStart) {
                let num;
                for (let i = 0; i < this.SRN; i++) {
                    for (let j = 0; j < this.SRN; j++) {
                        do { num = Math.floor(Math.random() * this.N + 1); }
                        while (!this.unUsedInBox(rowStart, colStart, num));
                        this.mat[rowStart + i][colStart + j] = num;
                    }
                }
            }
            checkIfSafe(i, j, num) {
                return (this.unUsedInRow(i, num) && this.unUsedInCol(j, num) && this.unUsedInBox(i - (i % this.SRN), j - (j % this.SRN), num));
            }
            unUsedInRow(i, num) {
                for (let j = 0; j < this.N; j++) if (this.mat[i][j] === num) return false;
                return true;
            }
            unUsedInCol(j, num) {
                for (let i = 0; i < this.N; i++) if (this.mat[i][j] === num) return false;
                return true;
            }
            fillRemaining(i, j) {
                if (j >= this.N && i < this.N - 1) { i = i + 1; j = 0; }
                if (i >= this.N && j >= this.N) return true;
                if (i < this.SRN) { if (j < this.SRN) j = this.SRN; }
                else if (i < this.N - this.SRN) { if (j === Math.floor(i / this.SRN) * this.SRN) j = j + this.SRN; }
                else {
                    if (j === this.N - this.SRN) {
                        i = i + 1; j = 0;
                        if (i >= this.N) return true;
                    }
                }
                for (let num = 1; num <= this.N; num++) {
                    if (this.checkIfSafe(i, j, num)) {
                        this.mat[i][j] = num;
                        if (this.fillRemaining(i, j + 1)) return true;
                        this.mat[i][j] = 0;
                    }
                }
                return false;
            }
            removeKDigits() {
                let count = this.K;
                while (count !== 0) {
                    let cellId = Math.floor(Math.random() * (this.N * this.N));
                    let i = Math.floor(cellId / this.N);
                    let j = cellId % 9;
                    if (this.mat[i][j] !== 0) {
                        count--;
                        this.mat[i][j] = 0;
                    }
                }
            }
        }

        // --- 상태 관리 ---
        let boardState = []; // 각 셀의 상태를 객체로 저장
        let selectedCell = null; // {r, c}
        let isGameOver = false;
        let isStarted = false; // 시작 버튼을 누르기 전에는 보드를 가리고 입력을 막음

        // 타이머
        let timerStart = 0;
        let timerInterval = null;

        // 난이도별 빈칸 개수
        const DIFFICULTY_BLANKS = { easy: 35, normal: 45, hard: 55 };
        let difficulty = 'normal';

        const boardEl = document.getElementById('sudoku-board');
        const boardWrapEl = document.getElementById('board-wrap');
        const numpadEl = document.getElementById('numpad');
        const msgArea = document.getElementById('message-area');
        const timerEl = document.getElementById('timer');

        // 게임 초기화
        function initGame() {
            isGameOver = false;
            isStarted = false;
            selectedCell = null;
            msgArea.style.opacity = '0';
            clearAllErrors();
            
            // 난이도에 따른 빈칸 개수
            const sudoku = new SudokuGenerator(DIFFICULTY_BLANKS[difficulty]);
            const { puzzle } = sudoku.fillValues();
            
            // 데이터 구조화: Set을 사용하여 입력된 모든 숫자를 관리합니다.
            boardState = [];
            for (let r = 0; r < 9; r++) {
                let row = [];
                for (let c = 0; c < 9; c++) {
                    let val = puzzle[r][c];
                    row.push({
                        isGiven: val !== 0,
                        isNote: false, // 숫자 1개라도 같은 줄/박스에 같은 숫자가 있으면 메모로 표시
                        digits: val !== 0 ? new Set([val]) : new Set()
                    });
                }
                boardState.push(row);
            }

            createBoardDOM();
            renderNumpad();
            renderDifficulty();
            stopTimer();
            timerEl.textContent = formatTime(0);
            boardWrapEl.classList.add('not-started');
            updateAllHighlights();
        }

        // 시작 버튼: 보드를 보여주고 타이머 시작
        function startGame() {
            if (isStarted) return;
            isStarted = true;
            boardWrapEl.classList.remove('not-started');
            startTimer();
        }

        // 초기 보드 HTML 생성
        function createBoardDOM() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    
                    if (c === 2 || c === 5) cell.classList.add('right-thick');
                    if (r === 2 || r === 5) cell.classList.add('bottom-thick');

                    cell.addEventListener('mousedown', () => selectCell(r, c));
                    boardEl.appendChild(cell);
                    
                    updateCellUI(r, c); // 내용 채우기
                }
            }
        }

        // 개별 셀의 화면(DOM) 업데이트 로직
        function updateCellUI(r, c) {
            const cellEl = document.getElementById(`cell-${r}-${c}`);
            const state = boardState[r][c];
            
            // 기존 텍스트/노드 지우기 및 클래스 초기화
            cellEl.innerHTML = '';
            cellEl.classList.remove('given', 'user-input');
            
            if (isMain(state)) {
                // 숫자가 1개이고 충돌이 없을 때: 정답(메인 숫자)으로 취급
                const val = Array.from(state.digits)[0];
                cellEl.textContent = val;
                cellEl.classList.add(state.isGiven ? 'given' : 'user-input');
            } else if (state.digits.size > 0) {
                // 숫자가 2개 이상이거나 충돌로 메모 처리된 경우: 메모(노트) 3x3 그리드로 취급
                const grid = document.createElement('div');
                grid.className = 'notes-grid';
                for(let i = 1; i <= 9; i++) {
                    const noteSpan = document.createElement('div');
                    noteSpan.className = 'note-num';
                    if (state.digits.has(i)) {
                        noteSpan.textContent = i;
                    }
                    grid.appendChild(noteSpan);
                }
                cellEl.appendChild(grid);
            }
        }

        // 하이라이트 로직 (관련 행/열/박스 및 같은 숫자 강조)
        function updateAllHighlights() {
            // 모든 하이라이트 제거
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('selected', 'related', 'same-number');
            });

            if (!selectedCell) return;

            const { r, c } = selectedCell;
            const selectedState = boardState[r][c];
            const selectedVal = isMain(selectedState) ? mainValue(selectedState) : null;

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cellEl = document.getElementById(`cell-${i}-${j}`);
                    const cellState = boardState[i][j];
                    
                    // 1. 선택된 셀
                    if (i === r && j === c) {
                        cellEl.classList.add('selected');
                    }
                    // 2. 관련 영역 (행, 열, 3x3 박스)
                    else if (i === r || j === c || (Math.floor(i/3) === Math.floor(r/3) && Math.floor(j/3) === Math.floor(c/3))) {
                        cellEl.classList.add('related');
                    }
                    // 3. 동일한 숫자 하이라이트 (단일 숫자일 때만)
                    if (selectedVal !== null && isMain(cellState) && mainValue(cellState) === selectedVal && (i !== r || j !== c)) {
                        cellEl.classList.add('same-number');
                    }
                }
            }
        }

        // 숫자 패드 생성
        function renderNumpad() {
            numpadEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-slate-200 text-slate-800 font-bold py-3 rounded-lg shadow-sm hover:bg-slate-50 btn-active text-lg sm:text-xl';
                btn.textContent = i;
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    inputNumber(i);
                });
                numpadEl.appendChild(btn);
            }
        }

        // 경과 시간(초)을 mm:ss 형식으로 변환
        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function elapsedSeconds() {
            return Math.floor((Date.now() - timerStart) / 1000);
        }

        function startTimer() {
            stopTimer();
            timerStart = Date.now();
            timerEl.textContent = formatTime(0);
            timerInterval = setInterval(() => {
                timerEl.textContent = formatTime(elapsedSeconds());
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        // 현재 난이도 버튼 강조
        function renderDifficulty() {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.level === difficulty);
            });
        }

        // 셀 선택 처리
        function selectCell(r, c) {
            if (isGameOver || !isStarted) return;
            selectedCell = { r, c };
            updateAllHighlights();
        }

        // 메인 숫자(크게 표시되는 단일 숫자)인지 여부
        function isMain(state) {
            return state.digits.size === 1 && !state.isNote;
        }

        function mainValue(state) {
            return Array.from(state.digits)[0];
        }

        // (r, c)와 같은 행/열/3x3 박스의 다른 칸에 val이 단일 숫자로 들어 있는지 검사
        // 먼저 입력했든 나중에 입력했든 겹치는 칸끼리는 모두 해당됨
        function hasDuplicate(r, c, val) {
            const startR = Math.floor(r / 3) * 3;
            const startC = Math.floor(c / 3) * 3;
            for (let i = 0; i < 9; i++) {
                const peers = [[r, i], [i, c], [startR + Math.floor(i / 3), startC + (i % 3)]];
                for (const [pr, pc] of peers) {
                    if (pr === r && pc === c) continue;
                    const peer = boardState[pr][pc];
                    if (peer.digits.size === 1 && mainValue(peer) === val) return true;
                }
            }
            return false;
        }

        // 겹치는 단일 숫자는 메모로, 겹침이 풀린 단일 숫자는 메인 숫자로 다시 계산
        function refreshNotes() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const state = boardState[r][c];
                    if (state.isGiven) continue;
                    const isNote = state.digits.size === 1 && hasDuplicate(r, c, mainValue(state));
                    if (state.isNote !== isNote) {
                        state.isNote = isNote;
                        updateCellUI(r, c);
                    }
                }
            }
        }

        // 숫자 입력 핵심 로직
        function inputNumber(num) {
            if (!selectedCell || isGameOver || !isStarted) return;
            const { r, c } = selectedCell;
            const state = boardState[r][c];
            
            if (state.isGiven) return; // 기본 숫자는 수정 불가

            clearAllErrors(); // 새 입력 시 기존 에러 시각효과 지움

            if (num === 0) {
                // 지우기
                state.digits.clear();
            } else {
                // 입력된 숫자 토글 (있으면 제거, 없으면 추가)
                if (state.digits.has(num)) {
                    state.digits.delete(num);
                } else {
                    state.digits.add(num);
                }
            }

            // 같은 줄/박스에서 겹치는 단일 숫자는 먼저 입력한 칸까지 모두 메모로 바꿈
            refreshNotes();
            updateCellUI(r, c);
            updateAllHighlights(); // 동일 숫자 하이라이트 갱신을 위해 호출
            checkWinCondition();
        }

        // 에러 표시 제거
        function clearAllErrors() {
            document.querySelectorAll('.cell.error').forEach(el => {
                el.classList.remove('error');
            });
        }

        // 논리적 오류 검사 (Check)
        function checkMistakes() {
            if (isGameOver) return;
            clearAllErrors();
            let hasError = false;
            let errorSet = new Set();

            // 겹쳐서 메모로 바뀐 단일 숫자 칸을 오류로 표시
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const state = boardState[r][c];
                    if (state.isNote) errorSet.add(`${r}-${c}`);
                }
            }

            errorSet.forEach(id => {
                document.getElementById(`cell-${id}`).classList.add('error');
                hasError = true;
            });

            return hasError;
        }

        // 모든 메인 숫자가 채워졌는지 확인
        function checkBoardFull() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    // 모든 칸이 메모가 아닌 메인 숫자 1개만을 가지고 있어야 완성
                    if (!isMain(boardState[r][c])) return false;
                }
            }
            return true;
        }

        // 승리 조건 체크
        function checkWinCondition() {
            if (checkBoardFull()) {
                if(!checkMistakes()) {
                    isGameOver = true;
                    selectedCell = null;
                    stopTimer();
                    const clearTime = formatTime(elapsedSeconds());
                    timerEl.textContent = clearTime;
                    updateAllHighlights();
                    msgArea.textContent = `축하합니다! 스도쿠를 완성했습니다! (기록 ${clearTime})`;
                    msgArea.style.opacity = '1';
                }
            }
        }

        // --- 이벤트 리스너 설정 ---

        // 키보드 조작
        window.addEventListener('keydown', (e) => {
            if (isGameOver || !isStarted) return;
            
            // 숫자 및 지우기
            if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
            else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') inputNumber(0);
            
            // 방향키 이동
            else if (selectedCell && e.key.startsWith('Arrow')) {
                e.preventDefault();
                let { r, c } = selectedCell;
                if (e.key === 'ArrowUp' && r > 0) r--;
                if (e.key === 'ArrowDown' && r < 8) r++;
                if (e.key === 'ArrowLeft' && c > 0) c--;
                if (e.key === 'ArrowRight' && c < 8) c++;
                selectCell(r, c);
            }
        });

        // 버튼 클릭
        document.getElementById('btn-new').addEventListener('click', initGame);
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 난이도를 바꾸면 해당 난이도로 새 게임 시작
                difficulty = btn.dataset.level;
                initGame();
            });
        });
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-check').addEventListener('click', () => {
            if (!isStarted) return;
            const hasError = checkMistakes();
            if (!hasError && !checkBoardFull() && !isGameOver) {
                const checkBtn = document.getElementById('btn-check');
                const origHTML = checkBtn.innerHTML;
                const origClass = checkBtn.className;
                
                checkBtn.textContent = '지금까지 맞아요!';
                checkBtn.className = 'flex-1 bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg shadow-sm transition';
                
                setTimeout(() => {
                    checkBtn.innerHTML = origHTML;
                    checkBtn.className = origClass;
                }, 1500);
            }
        });

        // 시작
        window.onload = initGame;

        // 오프라인 지원 (file://로 열면 지원 안 되므로 조용히 넘어감)
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
