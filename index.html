<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스도쿠</title>
    <meta name="description" content="브라우저에서 바로 즐기는 클래식 스도쿠 퍼즐">

    <!-- Open Graph / 링크 미리보기 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sudoku.elfsaycongrew.win/">
    <meta property="og:title" content="스도쿠">
    <meta property="og:description" content="브라우저에서 바로 즐기는 클래식 스도쿠 퍼즐">
    <meta property="og:image" content="https://sudoku.elfsaycongrew.win/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA / 홈 화면에 설치 -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="스도쿠">
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };

        // 다크 모드: 직접 고른 테마가 있으면 그걸, 없으면 기기 설정을 따름 (화면이 번쩍이지 않게 head에서 바로 적용)
        const THEME_KEY = 'sudoku-theme';
        const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function savedTheme() {
            try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
        }
        function isDarkTheme() {
            const theme = savedTheme();
            return theme ? theme === 'dark' : darkQuery.matches;
        }
        function applyTheme() {
            const dark = isDarkTheme();
            document.documentElement.classList.toggle('dark', dark);
            document.querySelector('meta[name="theme-color"]').content = dark ? '#0f172a' : '#f8fafc';
            if (window.renderThemeIcon) renderThemeIcon();
        }
        applyTheme();
        darkQuery.addEventListener('change', applyTheme);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --page-bg: #f8fafc;
            --page-text: #0f172a;
            --board-line: #1e293b;
            --board-bg: #ffffff;
            --cell-line: #cbd5e1;
            --given: #0f172a;
            --user-input: #2563eb;
            --related: #f1f5f9;
            --same-number: #e2e8f0;
            --selected: #bfdbfe;
            --error-bg: #fecaca;
            --error-text: #dc2626;
            --note: #64748b;
            --active-bg: #1e293b;
            --active-text: #ffffff;
        }
        html.dark {
            color-scheme: dark;
            --page-bg: #0f172a;
            --page-text: #e2e8f0;
            --board-line: #94a3b8;
            --board-bg: #1e293b;
            --cell-line: #334155;
            --given: #f1f5f9;
            --user-input: #60a5fa;
            --related: #273449;
            --same-number: #334155;
            --selected: #1e40af;
            --error-bg: #7f1d1d;
            --error-text: #fca5a5;
            --note: #94a3b8;
            --active-bg: #e2e8f0;
            --active-text: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--page-bg);
            color: var(--page-text);
            touch-action: manipulation;
            /* iOS Safari는 접두어 버전만 인식: 연타 시 글자 선택/돋보기/길게 누르기 메뉴가 뜨지 않게 함 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 스도쿠 보드 */
        /* 보드 전체를 정사각형으로 두고 9x9로 똑같이 나눔.
           칸 크기가 글자 크기와 무관해야 카카오톡 인앱 브라우저 등에서 글자를 키워도 보드가 밀려나지 않음 */
        #sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, minmax(0, 1fr));
            grid-template-rows: repeat(9, minmax(0, 1fr));
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 3px solid var(--board-line);
            background-color: var(--board-bg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* 시작 전/일시정지 중: 보드를 흐리게 가려서 미리 풀지 못하게 함 */
        #sudoku-board {
            transition: filter 0.4s ease;
        }
        #board-wrap.covered #sudoku-board {
            filter: blur(10px);
            pointer-events: none;
        }
        #start-overlay {
            transition: opacity 0.4s ease;
        }
        #board-wrap:not(.covered) #start-overlay {
            opacity: 0;
            pointer-events: none;
        }

        /* 개별 셀 기본 스타일 */
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            line-height: 1;
            border: 1px solid var(--cell-line);
            cursor: pointer;
            user-select: none;
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        @media (max-width: 400px) {
            .cell { font-size: 1.25rem; }
        }

        /* 3x3 구역 굵은 선 */
        .cell.right-thick { border-right: 3px solid var(--board-line); }
        .cell.bottom-thick { border-bottom: 3px solid var(--board-line); }

        /* 셀 내용 상태 */
        .cell.given {
            font-weight: 800;
            color: var(--given); /* 검정 */
        }
        .cell.user-input {
            font-weight: 600;
            color: var(--user-input); /* 파랑 */
        }

        /* 하이라이트 상태 */
        .cell.related {
            background-color: var(--related); /* 선택된 셀과 같은 행,열,박스 */
        }
        .cell.same-number {
            background-color: var(--same-number); /* 선택된 셀과 같은 숫자를 가진 셀 */
        }
        .cell.selected {
            background-color: var(--selected) !important; /* 선택된 셀 */
        }
        .cell.error {
            background-color: var(--error-bg) !important;
            color: var(--error-text) !important;
            transition: all 0.3s ease;
        }

        /* 메모 모드 (Pencil Marks) 그리드 스타일 */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            /* 셀 크기 계산에 끼어들지 않도록 절대 위치로 셀을 덮음 (iOS Safari에서 셀이 커지는 문제) */
            position: absolute;
            inset: 0;
            padding: 2px;
        }
        .note-num {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: var(--note); /* 회색 */
            line-height: 1;
        }
        @media (max-width: 400px) {
            .note-num { font-size: 0.5rem; }
        }

        /* 난이도 선택 버튼 */
        /* id까지 붙여서 Tailwind의 dark: 색상보다 우선 적용 */
        #difficulty .difficulty-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border-color: var(--active-bg);
        }

        /* 버튼 및 기타 UI */
        .btn-active:active { transform: scale(0.95); }
        .mode-btn-active {
            background-color: #10b981 !important; /* 메모 모드 ON 시 색상 (초록) */
            color: white !important;
            border-color: #059669 !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-2 sm:px-4">

    <!-- 헤더 -->
    <header class="relative w-full max-w-md text-center mb-4">
        <button id="btn-theme" class="absolute right-0 top-0 w-9 h-9 flex items-center justify-center rounded-full text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-700 transition btn-active"></button>
        <h1 class="text-3xl font-bold tracking-tight text-slate-800 dark:text-slate-100">스도쿠</h1>
        <div class="mt-1 flex items-center justify-center gap-1">
            <div id="timer" class="text-lg font-semibold text-slate-500 dark:text-slate-400 tabular-nums">00:00</div>
            <button id="btn-pause" class="invisible w-8 h-8 flex items-center justify-center rounded-full text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-700 transition btn-active" aria-label="일시정지"></button>
        </div>
    </header>

    <div class="w-full max-w-md">

        <!-- 난이도 선택 -->
        <div class="grid grid-cols-3 gap-2" id="difficulty">
            <button data-level="easy" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">쉬움</button>
            <button data-level="normal" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">보통</button>
            <button data-level="hard" class="difficulty-btn bg-white border-2 border-slate-200 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-200 font-semibold py-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">어려움</button>
        </div>

        <!-- 스도쿠 보드 (시작 전에는 흐리게 가려짐) -->
        <div id="board-wrap" class="relative mb-5 mt-2 covered">
            <div id="sudoku-board" class="rounded-sm">
                <!-- JavaScript를 통해 셀이 생성됩니다 -->
            </div>
            <div id="start-overlay" class="absolute inset-0 flex items-center justify-center">
                <button id="btn-start" class="bg-slate-800 hover:bg-slate-900 text-white dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 font-bold text-xl py-4 px-10 rounded-xl shadow-lg transition btn-active">&#9654; 시작</button>
            </div>
        </div>

        <!-- 하단 컨트롤 패널 -->
        <div class="space-y-4">
            <!-- 숫자 입력 패드 -->
            <div class="grid grid-cols-9 gap-1 sm:gap-2" id="numpad">
                <!-- 1~9 버튼 JS로 추가 -->
            </div>

            <!-- 액션 버튼 -->
            <div class="flex gap-2 sm:gap-4">
                <button id="btn-check" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">
                    정답 맞추기
                </button>
                <button id="btn-new" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-100 font-semibold py-3 px-2 rounded-lg shadow-sm transition btn-active text-sm sm:text-base">
                    새 게임
                </button>
            </div>
            
            <!-- 상태 메시지 -->
            <div id="message-area" class="text-center font-bold text-lg text-emerald-600 dark:text-emerald-400 h-8 opacity-0 transition-opacity flex items-center justify-center">
                축하합니다! 스도쿠를 완성했습니다!
            </div>
        </div>
    </div>

    <script>
        // --- 스도쿠 생성 알고리즘 (백트래킹) ---
        class SudokuGenerator {
            constructor(K = 45) {
                this.N = 9;
                this.SRN = 3;
                this.K = K;
                this.mat = Array.from({ length: this.N }, () => Array(this.N).fill(0));
            }
            fillValues() {
                this.fillDiagonal();
                this.fillRemaining(0, this.SRN);
                let solution = this.mat.map(row => [...row]);
                this.removeKDigits();
                return { puzzle: this.mat, solution: solution };
            }
            fillDiagonal() {
                for (let i = 0; i < this.N; i = i + this.SRN) this.fillBox(i, i);
            }
            unUsedInBox(rowStart, colStart, num) {
                for (let i = 0; i < this.SRN; i++)
                    for (let j = 0; j < this.SRN; j++)
                        if (this.mat[rowStart + i][colStart + j] === num) return false;
                return true;
            }
            fillBox(rowStart, colStart) {
                let num;
                for (let i = 0; i < this.SRN; i++) {
                    for (let j = 0; j < this.SRN; j++) {
                        do { num = Math.floor(Math.random() * this.N + 1); }
                        while (!this.unUsedInBox(rowStart, colStart, num));
                        this.mat[rowStart + i][colStart + j] = num;
                    }
                }
            }
            checkIfSafe(i, j, num) {
                return (this.unUsedInRow(i, num) && this.unUsedInCol(j, num) && this.unUsedInBox(i - (i % this.SRN), j - (j % this.SRN), num));
            }
            unUsedInRow(i, num) {
                for (let j = 0; j < this.N; j++) if (this.mat[i][j] === num) return false;
                return true;
            }
            unUsedInCol(j, num) {
                for (let i = 0; i < this.N; i++) if (this.mat[i][j] === num) return false;
                return true;
            }
            fillRemaining(i, j) {
                if (j >= this.N && i < this.N - 1) { i = i + 1; j = 0; }
                if (i >= this.N && j >= this.N) return true;
                if (i < this.SRN) { if (j < this.SRN) j = this.SRN; }
                else if (i < this.N - this.SRN) { if (j === Math.floor(i / this.SRN) * this.SRN) j = j + this.SRN; }
                else {
                    if (j === this.N - this.SRN) {
                        i = i + 1; j = 0;
                        if (i >= this.N) return true;
                    }
                }
                for (let num = 1; num <= this.N; num++) {
                    if (this.checkIfSafe(i, j, num)) {
                        this.mat[i][j] = num;
                        if (this.fillRemaining(i, j + 1)) return true;
                        this.mat[i][j] = 0;
                    }
                }
                return false;
            }
            removeKDigits() {
                let count = this.K;
                while (count !== 0) {
                    let cellId = Math.floor(Math.random() * (this.N * this.N));
                    let i = Math.floor(cellId / this.N);
                    let j = cellId % 9;
                    if (this.mat[i][j] !== 0) {
                        count--;
                        this.mat[i][j] = 0;
                    }
                }
            }
        }

        // --- 상태 관리 ---
        let boardState = []; // 각 셀의 상태를 객체로 저장
        let selectedCell = null; // {r, c}
        let isGameOver = false;
        let isStarted = false; // 시작 버튼을 누르기 전에는 보드를 가리고 입력을 막음
        let isPaused = false; // 일시정지 중에도 보드를 가리고 입력을 막음

        // 타이머: 멈출 때마다 지난 시간을 elapsedMs에 쌓아 두고, 돌아가는 동안은 runningSince부터 더함
        let elapsedMs = 0;
        let runningSince = null;
        let timerInterval = null;

        // 진행 상황 저장 (브라우저 localStorage)
        const SAVE_KEY = 'sudoku-save-v1';

        const PAUSE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
        const MOON_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
        const SUN_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
        const PLAY_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';

        // 난이도별 빈칸 개수
        const DIFFICULTY_BLANKS = { easy: 35, normal: 45, hard: 55 };
        let difficulty = 'normal';

        const boardEl = document.getElementById('sudoku-board');
        const boardWrapEl = document.getElementById('board-wrap');
        const numpadEl = document.getElementById('numpad');
        const msgArea = document.getElementById('message-area');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('btn-start');
        const pauseBtn = document.getElementById('btn-pause');
        const themeBtn = document.getElementById('btn-theme');

        // 다크 모드 버튼: 지금 테마의 반대로 바꿀 수 있다는 걸 아이콘으로 보여줌
        function renderThemeIcon() {
            const dark = isDarkTheme();
            themeBtn.innerHTML = dark ? SUN_ICON : MOON_ICON;
            themeBtn.setAttribute('aria-label', dark ? '라이트 모드' : '다크 모드');
        }
        renderThemeIcon();
        themeBtn.addEventListener('click', () => {
            try { localStorage.setItem(THEME_KEY, isDarkTheme() ? 'light' : 'dark'); } catch (e) {}
            applyTheme();
        });

        // 게임 초기화
        function initGame() {
            // 난이도에 따른 빈칸 개수
            const sudoku = new SudokuGenerator(DIFFICULTY_BLANKS[difficulty]);
            const { puzzle } = sudoku.fillValues();
            
            // 데이터 구조화: Set을 사용하여 입력된 모든 숫자를 관리합니다.
            boardState = [];
            for (let r = 0; r < 9; r++) {
                let row = [];
                for (let c = 0; c < 9; c++) {
                    let val = puzzle[r][c];
                    row.push({
                        isGiven: val !== 0,
                        isNote: false, // 숫자 1개라도 같은 줄/박스에 같은 숫자가 있으면 메모로 표시
                        digits: val !== 0 ? new Set([val]) : new Set()
                    });
                }
                boardState.push(row);
            }

            isStarted = false;
            isPaused = false;
            resetTimer(0);
            setupBoard();
            saveGame();
        }

        // 저장된 게임 불러오기 (없거나 깨졌으면 false)
        function restoreGame() {
            let data;
            try {
                data = JSON.parse(localStorage.getItem(SAVE_KEY));
            } catch (e) {
                return false;
            }
            if (!data || !Array.isArray(data.cells) || data.cells.length !== 9 ||
                !data.cells.every(row => Array.isArray(row) && row.length === 9)) return false;

            difficulty = data.difficulty in DIFFICULTY_BLANKS ? data.difficulty : 'normal';
            boardState = data.cells.map(row => row.map(cell => ({
                isGiven: !!cell.given,
                isNote: false, // setupBoard에서 다시 계산
                digits: new Set(cell.digits)
            })));

            // 이어서 할 때는 일시정지 상태로 열어서, 계속 버튼을 눌러야 타이머가 다시 돎
            isStarted = !!data.isStarted;
            isPaused = isStarted;
            resetTimer(Number(data.elapsedMs) || 0);
            setupBoard();
            return true;
        }

        // 현재 게임을 localStorage에 저장 (사생활 보호 모드 등에서 실패하면 조용히 넘어감)
        function saveGame() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify({
                    difficulty,
                    isStarted,
                    elapsedMs: currentElapsedMs(),
                    cells: boardState.map(row => row.map(state => ({
                        given: state.isGiven,
                        digits: Array.from(state.digits)
                    })))
                }));
            } catch (e) {}
        }

        function clearSave() {
            try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        }

        // 새 게임과 불러온 게임이 공통으로 쓰는 화면 준비
        function setupBoard() {
            isGameOver = false;
            selectedCell = null;
            msgArea.style.opacity = '0';
            clearAllErrors();
            createBoardDOM();
            refreshNotes();
            renderNumpad();
            renderDifficulty();
            renderCover();
            updateAllHighlights();
        }

        // 시작 전/일시정지 중이면 보드를 가리고, 시작·계속 버튼과 일시정지 아이콘을 상태에 맞춤
        function renderCover() {
            boardWrapEl.classList.toggle('covered', !isStarted || isPaused);
            startBtn.innerHTML = isStarted ? '&#9654; 계속' : '&#9654; 시작';
            pauseBtn.classList.toggle('invisible', !isStarted || isGameOver);
            pauseBtn.innerHTML = isPaused ? PLAY_ICON : PAUSE_ICON;
            pauseBtn.setAttribute('aria-label', isPaused ? '계속' : '일시정지');
        }

        // 시작 버튼: 보드를 보여주고 타이머 시작
        function startGame() {
            if (isStarted) return;
            isStarted = true;
            renderCover();
            startTimer();
            saveGame();
        }

        function pauseGame() {
            if (!isStarted || isPaused || isGameOver) return;
            isPaused = true;
            stopTimer();
            renderCover();
            saveGame();
        }

        function resumeGame() {
            if (!isPaused) return;
            isPaused = false;
            renderCover();
            startTimer();
            saveGame();
        }

        // 초기 보드 HTML 생성
        function createBoardDOM() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    
                    if (c === 2 || c === 5) cell.classList.add('right-thick');
                    if (r === 2 || r === 5) cell.classList.add('bottom-thick');

                    cell.addEventListener('mousedown', () => selectCell(r, c));
                    boardEl.appendChild(cell);
                    
                    updateCellUI(r, c); // 내용 채우기
                }
            }
        }

        // 개별 셀의 화면(DOM) 업데이트 로직
        function updateCellUI(r, c) {
            const cellEl = document.getElementById(`cell-${r}-${c}`);
            const state = boardState[r][c];
            
            // 기존 텍스트/노드 지우기 및 클래스 초기화
            cellEl.innerHTML = '';
            cellEl.classList.remove('given', 'user-input');
            
            if (isMain(state)) {
                // 숫자가 1개이고 충돌이 없을 때: 정답(메인 숫자)으로 취급
                const val = Array.from(state.digits)[0];
                cellEl.textContent = val;
                cellEl.classList.add(state.isGiven ? 'given' : 'user-input');
            } else if (state.digits.size > 0) {
                // 숫자가 2개 이상이거나 충돌로 메모 처리된 경우: 메모(노트) 3x3 그리드로 취급
                const grid = document.createElement('div');
                grid.className = 'notes-grid';
                for(let i = 1; i <= 9; i++) {
                    const noteSpan = document.createElement('div');
                    noteSpan.className = 'note-num';
                    if (state.digits.has(i)) {
                        noteSpan.textContent = i;
                    }
                    grid.appendChild(noteSpan);
                }
                cellEl.appendChild(grid);
            }
        }

        // 하이라이트 로직 (관련 행/열/박스 및 같은 숫자 강조)
        function updateAllHighlights() {
            // 모든 하이라이트 제거
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('selected', 'related', 'same-number');
            });

            if (!selectedCell) return;

            const { r, c } = selectedCell;
            const selectedState = boardState[r][c];
            const selectedVal = isMain(selectedState) ? mainValue(selectedState) : null;

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cellEl = document.getElementById(`cell-${i}-${j}`);
                    const cellState = boardState[i][j];
                    
                    // 1. 선택된 셀
                    if (i === r && j === c) {
                        cellEl.classList.add('selected');
                    }
                    // 2. 관련 영역 (행, 열, 3x3 박스)
                    else if (i === r || j === c || (Math.floor(i/3) === Math.floor(r/3) && Math.floor(j/3) === Math.floor(c/3))) {
                        cellEl.classList.add('related');
                    }
                    // 3. 동일한 숫자 하이라이트 (단일 숫자일 때만)
                    if (selectedVal !== null && isMain(cellState) && mainValue(cellState) === selectedVal && (i !== r || j !== c)) {
                        cellEl.classList.add('same-number');
                    }
                }
            }
        }

        // 숫자 패드 생성
        function renderNumpad() {
            numpadEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-slate-200 text-slate-800 hover:bg-slate-50 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100 dark:hover:bg-slate-700 font-bold py-3 rounded-lg shadow-sm btn-active text-lg sm:text-xl';
                btn.textContent = i;
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    inputNumber(i);
                });
                numpadEl.appendChild(btn);
            }
        }

        // 경과 시간(초)을 mm:ss 형식으로 변환
        function formatTime(seconds) {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function currentElapsedMs() {
            return elapsedMs + (runningSince !== null ? Date.now() - runningSince : 0);
        }

        function elapsedSeconds() {
            return Math.floor(currentElapsedMs() / 1000);
        }

        function renderTimer() {
            timerEl.textContent = formatTime(elapsedSeconds());
        }

        function startTimer() {
            if (runningSince !== null) return;
            runningSince = Date.now();
            renderTimer();
            timerInterval = setInterval(renderTimer, 1000);
        }

        // 지금까지 흐른 시간을 쌓아 두고 멈춤
        function stopTimer() {
            elapsedMs = currentElapsedMs();
            runningSince = null;
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer(ms) {
            stopTimer();
            elapsedMs = ms;
            renderTimer();
        }

        // 현재 난이도 버튼 강조
        function renderDifficulty() {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.level === difficulty);
            });
        }

        // 셀 선택 처리
        function selectCell(r, c) {
            if (isGameOver || !isStarted || isPaused) return;
            selectedCell = { r, c };
            updateAllHighlights();
        }

        // 메인 숫자(크게 표시되는 단일 숫자)인지 여부
        function isMain(state) {
            return state.digits.size === 1 && !state.isNote;
        }

        function mainValue(state) {
            return Array.from(state.digits)[0];
        }

        // (r, c)와 같은 행/열/3x3 박스의 다른 칸에 val이 단일 숫자로 들어 있는지 검사
        // 먼저 입력했든 나중에 입력했든 겹치는 칸끼리는 모두 해당됨
        function hasDuplicate(r, c, val) {
            const startR = Math.floor(r / 3) * 3;
            const startC = Math.floor(c / 3) * 3;
            for (let i = 0; i < 9; i++) {
                const peers = [[r, i], [i, c], [startR + Math.floor(i / 3), startC + (i % 3)]];
                for (const [pr, pc] of peers) {
                    if (pr === r && pc === c) continue;
                    const peer = boardState[pr][pc];
                    if (peer.digits.size === 1 && mainValue(peer) === val) return true;
                }
            }
            return false;
        }

        // 겹치는 단일 숫자는 메모로, 겹침이 풀린 단일 숫자는 메인 숫자로 다시 계산
        function refreshNotes() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const state = boardState[r][c];
                    if (state.isGiven) continue;
                    const isNote = state.digits.size === 1 && hasDuplicate(r, c, mainValue(state));
                    if (state.isNote !== isNote) {
                        state.isNote = isNote;
                        updateCellUI(r, c);
                    }
                }
            }
        }

        // 숫자 입력 핵심 로직
        function inputNumber(num) {
            if (!selectedCell || isGameOver || !isStarted || isPaused) return;
            const { r, c } = selectedCell;
            const state = boardState[r][c];
            
            if (state.isGiven) return; // 기본 숫자는 수정 불가

            clearAllErrors(); // 새 입력 시 기존 에러 시각효과 지움

            if (num === 0) {
                // 지우기
                state.digits.clear();
            } else {
                // 입력된 숫자 토글 (있으면 제거, 없으면 추가)
                if (state.digits.has(num)) {
                    state.digits.delete(num);
                } else {
                    state.digits.add(num);
                }
            }

            // 같은 줄/박스에서 겹치는 단일 숫자는 먼저 입력한 칸까지 모두 메모로 바꿈
            refreshNotes();
            updateCellUI(r, c);
            updateAllHighlights(); // 동일 숫자 하이라이트 갱신을 위해 호출
            saveGame();
            checkWinCondition();
        }

        // 에러 표시 제거
        function clearAllErrors() {
            document.querySelectorAll('.cell.error').forEach(el => {
                el.classList.remove('error');
            });
        }

        // 논리적 오류 검사 (Check)
        function checkMistakes() {
            if (isGameOver) return;
            clearAllErrors();
            let hasError = false;
            let errorSet = new Set();

            // 겹쳐서 메모로 바뀐 단일 숫자 칸을 오류로 표시
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const state = boardState[r][c];
                    if (state.isNote) errorSet.add(`${r}-${c}`);
                }
            }

            errorSet.forEach(id => {
                document.getElementById(`cell-${id}`).classList.add('error');
                hasError = true;
            });

            return hasError;
        }

        // 모든 메인 숫자가 채워졌는지 확인
        function checkBoardFull() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    // 모든 칸이 메모가 아닌 메인 숫자 1개만을 가지고 있어야 완성
                    if (!isMain(boardState[r][c])) return false;
                }
            }
            return true;
        }

        // 승리 조건 체크
        function checkWinCondition() {
            if (checkBoardFull()) {
                if(!checkMistakes()) {
                    isGameOver = true;
                    selectedCell = null;
                    stopTimer();
                    clearSave(); // 다 푼 게임은 다시 열면 새 게임으로 시작
                    const clearTime = formatTime(elapsedSeconds());
                    timerEl.textContent = clearTime;
                    renderCover();
                    updateAllHighlights();
                    msgArea.textContent = `축하합니다! 스도쿠를 완성했습니다! (기록 ${clearTime})`;
                    msgArea.style.opacity = '1';
                }
            }
        }

        // --- 이벤트 리스너 설정 ---

        // 키보드 조작
        window.addEventListener('keydown', (e) => {
            if (isGameOver || !isStarted || isPaused) return;
            
            // 숫자 및 지우기
            if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
            else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') inputNumber(0);
            
            // 방향키 이동
            else if (selectedCell && e.key.startsWith('Arrow')) {
                e.preventDefault();
                let { r, c } = selectedCell;
                if (e.key === 'ArrowUp' && r > 0) r--;
                if (e.key === 'ArrowDown' && r < 8) r++;
                if (e.key === 'ArrowLeft' && c > 0) c--;
                if (e.key === 'ArrowRight' && c < 8) c++;
                selectCell(r, c);
            }
        });

        // 버튼 클릭
        document.getElementById('btn-new').addEventListener('click', initGame);
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 난이도를 바꾸면 해당 난이도로 새 게임 시작
                difficulty = btn.dataset.level;
                initGame();
            });
        });
        startBtn.addEventListener('click', () => {
            if (isStarted) resumeGame();
            else startGame();
        });
        pauseBtn.addEventListener('click', () => {
            if (isPaused) resumeGame();
            else pauseGame();
        });
        document.getElementById('btn-check').addEventListener('click', () => {
            if (!isStarted || isPaused) return;
            const hasError = checkMistakes();
            if (!hasError && !checkBoardFull() && !isGameOver) {
                const checkBtn = document.getElementById('btn-check');
                const origHTML = checkBtn.innerHTML;
                const origClass = checkBtn.className;
                
                checkBtn.textContent = '지금까지 맞아요!';
                checkBtn.className = 'flex-1 bg-emerald-500 text-white font-semibold py-3 px-4 rounded-lg shadow-sm transition';
                
                setTimeout(() => {
                    checkBtn.innerHTML = origHTML;
                    checkBtn.className = origClass;
                }, 1500);
            }
        });

        // 화면을 끄거나 다른 앱/탭으로 가면 자동 일시정지 (저장도 같이 됨)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) pauseGame();
        });
        window.addEventListener('pagehide', pauseGame);

        // 시작: 저장된 게임이 있으면 이어서, 없으면 새 게임
        window.onload = () => {
            if (!restoreGame()) initGame();
        };

        // 오프라인 지원 (file://로 열면 지원 안 되므로 조용히 넘어감)
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
